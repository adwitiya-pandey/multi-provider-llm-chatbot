name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .

      - name: Cache Tiktoken BPE Vocabulary
        uses: actions/cache@v4
        with:
          path: ~/.cache/tiktoken
          key: ${{ runner.os }}-tiktoken-v1

      - name: Run Pytest with Coverage Gate (>=85%)
        run: uv run pytest -q --cov=src/chatbot --cov-report=term-missing --cov-fail-under=85
        env:
          TIKTOKEN_CACHE_DIR: /home/runner/.cache/tiktoken
